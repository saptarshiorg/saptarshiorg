<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Saptarshi Samanta" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .fg{fill:#0a0a0f}.ac{fill:#6d28ff}.mute{fill:#5d5d6b}
    @media (prefers-color-scheme:dark){.fg{fill:#f5f5fa}.ac{fill:#9d6bff}.mute{fill:#9a9aae}}
    text{font-family:"Unbounded","Arial Black",system-ui,sans-serif;font-weight:800;letter-spacing:-2px}
    .up{transform:translateY(130px);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
    .d2{animation-delay:.15s}
    .fade{opacity:0;animation:fade .8s ease .9s forwards}
    @keyframes up{to{transform:translateY(0)}}
    @keyframes fade{to{opacity:1}}
  </style>
  <defs>
    <clipPath id="c1"><rect x="0" y="20" width="900" height="110"/></clipPath>
    <clipPath id="c2"><rect x="0" y="135" width="900" height="110"/></clipPath>
  </defs>
  <text class="mute fade" x="8" y="14" style="font:400 15px system-ui,sans-serif;letter-spacing:0">Kolkata, West Bengal, India</text>
  <g clip-path="url(#c1)"><text class="fg up" x="4" y="115" font-size="100">Saptarshi</text></g>
  <g clip-path="url(#c2)"><text class="ac up d2" x="4" y="230" font-size="100">Samanta</text></g>
  <text class="mute fade" x="8" y="280" style="font:500 18px system-ui,sans-serif;letter-spacing:0">RISHI FORGE · Code. Build. Create. Repeat.</text>
</svg>
