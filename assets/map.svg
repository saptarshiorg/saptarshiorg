<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="Schematic map: Kolkata city centre and CCU airport, about 13 kilometres apart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#f6f4fc;stroke:#e4e2ee}.grid{stroke:#e4e2ee;stroke-width:1;fill:none}
    .route{stroke:#6d28ff;stroke-width:2;stroke-dasharray:6 7;fill:none;animation:dash 1.2s linear infinite}
    .pt{fill:#6d28ff}.ring{fill:none;stroke:#6d28ff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
    text{fill:#0a0a0f;font:600 15px system-ui,sans-serif}text.sub{fill:#5d5d6b;font:400 13px system-ui,sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#0d0c14;stroke:#24232f}.grid{stroke:#24232f}.route,.ring{stroke:#9d6bff}.pt{fill:#9d6bff}text{fill:#f5f5fa}text.sub{fill:#9a9aae}}
    @keyframes ping{from{transform:scale(.5);opacity:.7}to{transform:scale(2.2);opacity:0}}
    @keyframes dash{to{stroke-dashoffset:-26}}
  </style>
  <rect class="bg" x="0.5" y="0.5" width="519" height="379" rx="20"/>
  <path class="grid" d="M0 95H520M0 190H520M0 285H520M130 0V380M260 0V380M390 0V380"/>
  <path class="route" d="M150 285 C 220 240, 300 150, 370 95"/>
  <circle class="ring" cx="150" cy="285" r="14"/>
  <circle class="pt" cx="150" cy="285" r="7"/>
  <text x="166" y="296">Kolkata</text>
  <text class="sub" x="166" y="314">City centre</text>
  <circle class="ring" cx="370" cy="95" r="14" style="animation-delay:1.2s"/>
  <circle class="pt" cx="370" cy="95" r="7"/>
  <text x="294" y="72">CCU airport</text>
  <text class="sub" x="294" y="56">Netaji Subhas Chandra Bose Intl</text>
  <text class="sub" x="236" y="205" transform="rotate(-38 236 205)">about 13 km</text>
  <text class="sub" x="478" y="28">N ↑</text>
</svg>
