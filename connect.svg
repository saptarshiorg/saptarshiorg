<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0221"/>
      <stop offset="50%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7B2FF7" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF00E5" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#grid)"/>
  <circle cx="850" cy="200" r="220" fill="url(#glowMagenta)"/>

  <text x="500" y="45" font-family="Orbitron, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#FF00E5" text-anchor="middle">📡 CONNECT WITH ME</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">
    <g transform="translate(150,75)">
      <rect width="160" height="42" rx="21" fill="#0B0716" stroke="#00F0FF" stroke-width="1.2" filter="url(#softGlow)"/>
      <text x="80" y="27" fill="#ffffff" text-anchor="middle">🐙 GitHub</text>
    </g>
    <g transform="translate(340,75)">
      <rect width="160" height="42" rx="21" fill="#0B0716" stroke="#FF00E5" stroke-width="1.2" filter="url(#softGlow)"/>
      <text x="80" y="27" fill="#ffffff" text-anchor="middle">📷 Instagram</text>
    </g>
    <g transform="translate(530,75)">
      <rect width="160" height="42" rx="21" fill="#0B0716" stroke="#7B2FF7" stroke-width="1.2" filter="url(#softGlow)"/>
      <text x="80" y="27" fill="#ffffff" text-anchor="middle">▶️ YouTube</text>
    </g>
    <g transform="translate(720,75)">
      <rect width="160" height="42" rx="21" fill="#0B0716" stroke="#00F0FF" stroke-width="1.2" filter="url(#softGlow)"/>
      <text x="80" y="27" fill="#ffffff" text-anchor="middle">🌐 Website</text>
    </g>
  </g>

  <text x="500" y="165" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8b8b9e" text-anchor="middle">profile views tracked below</text>
</svg>
